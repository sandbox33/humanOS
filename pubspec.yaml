name: humanos
description: HumanOS v3 — nutrición, Heavy Duty, calor del taller, recuperación y hábitos. Offline.
publish_to: none
version: 3.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  humanos_core:
    path: packages/humanos_core
  audioplayers: ^6.8.1
  cryptography: ^2.9.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter_blue_plus: ^2.3.14
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  google_mlkit_text_recognition: ^0.17.1
  health: ^13.3.2
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: any
  mobile_scanner: ^7.4.2
  path: any
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.7.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/audio/
    - assets/fonts/
  shaders:
    - assets/shaders/crt.frag
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
