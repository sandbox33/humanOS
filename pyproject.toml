[project]
name = "humanos"
version = "1.0.0"
description = "HumanOS — sistema personal de nutrición, alarmas y rendimiento"
requires-python = ">=3.11"
dependencies = [
    "flet==0.28.3",
    "peewee>=3.17.0",
]

[tool.flet]
org = "com.altair"
product = "HumanOS"
company = "Altair"
copyright = "Copyright (c) 2026 Altair"
build_number = 1

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android]
# minSdk 24 = Android 7.0. Cubre prácticamente todo el parque activo.
min_sdk_version = 24

[tool.flet.android.permission]
# Notificaciones (Android 13+ exige opt-in explícito)
"android.permission.POST_NOTIFICATIONS" = true

# Alarmas exactas. USE_EXACT_ALARM se concede automáticamente cuando la
# alarma es la función central de la app; SCHEDULE_EXACT_ALARM requiere que
# el usuario la habilite en Ajustes > Alarmas y recordatorios.
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.USE_EXACT_ALARM" = true

# Necesario para que la notificación aparezca sobre la pantalla de bloqueo.
"android.permission.USE_FULL_SCREEN_INTENT" = true

# Reprograma las alarmas tras reiniciar el teléfono. Sin esto, Android las
# borra en cada arranque y el sistema queda mudo hasta abrir la app.
"android.permission.RECEIVE_BOOT_COMPLETED" = true

# Mantiene el dispositivo despierto lo justo para disparar la alarma.
"android.permission.WAKE_LOCK" = true

# No se usa red: la app es 100% local.
"android.permission.INTERNET" = false
