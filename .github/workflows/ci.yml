name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Palabras prohibidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin TODO / FIXME / placeholder en el código
        run: |
          if grep -rnE "TODO|FIXME|placeholder" lib packages etl --exclude-dir=.dart_tool --exclude-dir=__pycache__ 2>/dev/null; then
            echo "::error::Hay palabras prohibidas en el código (TODO, FIXME o placeholder)."
            exit 1
          fi
          echo "Sin palabras prohibidas."

  core:
    name: humanos_core (dart test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/humanos_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

  etl:
    name: ETL (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Caché de descargas USDA
        uses: actions/cache@v4
        with:
          path: etl/.cache
          key: fdc-${{ hashFiles('etl/sources/fdc.py') }}
          restore-keys: fdc-
      - run: python -m pip install -r etl/requirements.txt
      - name: Pruebas (incluye datos reales de USDA)
        run: python -m pytest etl/tests -v -rs

  # Static checks first: a lint or a schema drift fails here in about two
  # minutes, and the tests and the APK wait for it. The app code is not
  # dart-formatted (most files would change), so only humanos_core checks
  # the format.
  analyze:
    name: App Flutter (analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: pubspec.lock resuelto frente al commit
        run: git --no-pager diff --exit-code -- pubspec.lock || echo "::warning::pubspec.lock cambió al resolver; súbelo con el diff de arriba."
      - name: Generar código (drift)
        run: dart run build_runner build
      - name: Esquema drift guardado igual al código
        run: |
          mkdir -p "$RUNNER_TEMP/schema"
          dart run drift_dev schema dump lib/data/user_db.dart "$RUNNER_TEMP/schema/"
          for f in "$RUNNER_TEMP"/schema/*.json; do
            diff -u "drift_schemas/$(basename "$f")" "$f"
          done
      - run: flutter analyze

  app:
    name: App Flutter (test)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generar código (drift)
        run: dart run build_runner build
      # Every test by name, and none may hang the job.
      - run: flutter test --reporter expanded --timeout 90s

  referencias:
    name: Referencias externas (versiones, API, checksums)
    runs-on: ubuntu-latest
    steps:
      - name: Versiones publicadas en Google Maven
        run: |
          for a in com/google/android/gms/play-services-location com/google/ai/edge/litertlm/litertlm-android; do
            echo "== $a"
            curl -fsS "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" | grep -E '<latest>|<release>|<lastUpdated>' || true
          done
      - name: API pública de litertlm-android
        run: |
          v=$(curl -fsS https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          echo "version=$v"
          curl -fsSLo litertlm.aar "https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/$v/litertlm-android-$v.aar"
          unzip -o -q litertlm.aar classes.jar AndroidManifest.xml
          grep -o 'minSdkVersion="[0-9]*"' AndroidManifest.xml || true
          unzip -l classes.jar | awk '{print $4}' | grep '\.class$' | grep -v '\$' | sed 's/\.class$//' | tr / . > classes.txt
          wc -l classes.txt
          javap -public -classpath classes.jar 'com.google.ai.edge.litertlm.Backend$CPU' 'com.google.ai.edge.litertlm.Content$Text' || true
          unzip -l classes.jar | awk '{print $4}' | grep -E 'litertlm/(Backend|Content)\$' || true
          curl -fsS "https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/$v/litertlm-android-$v.pom" | grep -A3 '<dependency>' | grep -E 'groupId|artifactId|version' || true
      - name: Modelos oficiales en Hugging Face (tamaño y SHA-256)
        run: |
          for repo in litert-community/gemma-3-270m-it litert-community/Gemma3-1B-IT; do
            echo "== $repo"
            curl -fsS "https://huggingface.co/api/models/$repo/tree/main" | python3 -c "
          import json, sys
          for f in json.load(sys.stdin):
              # The app pins these sizes (model_manager.dart); the SHA-256 of a
              # license-gated file is only shown with an accepted token, so
              # the app reads it with the user's own token.
              if f['path'] in ('gemma3-270m-it-q8.litertlm', 'gemma3-1b-it-int4.litertlm'):
                  print(f['path'], f.get('size'))
          " || true
            curl -fsS "https://huggingface.co/api/models/$repo" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('gated:', d.get('gated'), 'license:', (d.get('cardData') or {}).get('license'))
          " || true
          done

  android:
    name: APK de prueba (firma de depuración)
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Completar el proyecto Android (solo archivos que faltan)
        run: flutter create --org com.altair --project-name humanos --platforms android .
      - run: flutter pub get
      - name: Generar código (drift)
        run: dart run build_runner build
      - name: Compilar (release arm64, sin publicar)
        run: flutter build apk --release --target-platform android-arm64
