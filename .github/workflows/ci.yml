name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Palabras prohibidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin TODO / FIXME / placeholder en el código
        run: |
          if grep -rnE "TODO|FIXME|placeholder" lib packages etl --exclude-dir=.dart_tool --exclude-dir=__pycache__ 2>/dev/null; then
            echo "::error::Hay palabras prohibidas en el código (TODO, FIXME o placeholder)."
            exit 1
          fi
          echo "Sin palabras prohibidas."

  core:
    name: humanos_core (dart test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/humanos_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

  etl:
    name: ETL (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Caché de descargas USDA
        uses: actions/cache@v4
        with:
          path: etl/.cache
          key: fdc-${{ hashFiles('etl/sources/fdc.py') }}
          restore-keys: fdc-
      - run: python -m pip install -r etl/requirements.txt
      - name: Pruebas (incluye datos reales de USDA)
        run: python -m pytest etl/tests -v -rs

  app:
    name: App Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: pubspec.lock resuelto (gzip + base64)
        run: echo "LOCK_B64=$(gzip -9c pubspec.lock | base64 -w0)"
      - name: Generar código (drift)
        run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  android:
    name: APK de prueba (firma de depuración)
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Completar el proyecto Android (solo archivos que faltan)
        run: flutter create --org com.altair --project-name humanos --platforms android .
      - run: flutter pub get
      - name: Generar código (drift)
        run: dart run build_runner build
      - name: Compilar (release arm64, sin publicar)
        run: flutter build apk --release --target-platform android-arm64
