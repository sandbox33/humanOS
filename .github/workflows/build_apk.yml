name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/build_apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/Android/sdk
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: android-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3

      - name: Build APK
        run: |
          flet build apk \
            --project HumanOS \
            --product HumanOS \
            --org com.altair \
            --verbose

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: humanos-apk
          path: build/apk/*.apk
          retention-days: 14
          if-no-files-found: error
